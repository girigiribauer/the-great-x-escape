name: CI

# push(main)と全PRで型チェックと単体テストを回す。
# E2E(Playwright)はローカル Supabase + dev サーバーが要るため CI では実行しない。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
